name: Production Release (Cross-Platform Matrix)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target platform to build (all, macos-arm64, windows-x64)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - macos-arm64
          - windows-x64
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: ${{ matrix.name }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm64
            name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            artifact_pattern: 'src-tauri/target/release/bundle/dmg/*.dmg'
          - id: windows-x64
            name: Windows x86-64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact_pattern: 'src-tauri/target/release/bundle/nsis/*.exe,src-tauri/target/release/bundle/msi/*.msi'

    steps:
      - name: Filter target
        id: filter
        shell: bash
        run: |
          CHOICE="${{ github.event.inputs.target || 'all' }}"
          if [ "$CHOICE" != "all" ] && [ "$CHOICE" != "${{ matrix.id }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.filter.outputs.skip != 'true'

      - name: Setup Bun
        if: steps.filter.outputs.skip != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        if: steps.filter.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - name: Cache cargo registry & target
        if: steps.filter.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            src-tauri/target
            core/target
          key: ${{ matrix.target }}-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target }}-release-cargo-

      - name: Install frontend dependencies
        if: steps.filter.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Stage offline multimedia binaries
        if: steps.filter.outputs.skip != 'true'
        run: bun run tools/package-offline.ts --target=${{ matrix.id }}

      - name: Build frontend web assets
        if: steps.filter.outputs.skip != 'true'
        run: bun run build

      - name: Build production desktop bundle
        if: steps.filter.outputs.skip != 'true'
        shell: bash
        run: |
          rm -rf src-tauri/target/release/bundle || true
          if [ "${{ runner.os }}" = "macOS" ]; then
            echo "Building macOS application bundle..."
            bunx tauri build --bundles app

            APP_PATH="src-tauri/target/release/bundle/macos/Mar2i.app"
            if [ -d "$APP_PATH" ]; then
              echo "Applying ad-hoc code signature to nested sidecar binaries..."
              find "$APP_PATH/Contents/Resources" -type f -perm +111 -exec codesign --force --options runtime --sign - {} + 2>/dev/null || true
              echo "Applying ad-hoc code signature to main app bundle..."
              codesign --force --options runtime --deep --sign - "$APP_PATH"
              echo "Verifying code signature..."
              codesign --verify --deep --strict --verbose=2 "$APP_PATH"
            fi

            echo "Packaging DMG containing signed bundle..."
            STAGING_DIR="$(mktemp -d)/dmg-staging"
            mkdir -p "$STAGING_DIR"
            cp -R "$APP_PATH" "$STAGING_DIR/"
            ln -s /Applications "$STAGING_DIR/Applications"

            cp "scripts/dmg-launcher.command" "$STAGING_DIR/تشغيل لأول مرة (حل مشكلة تالف).command"
            chmod +x "$STAGING_DIR/تشغيل لأول مرة (حل مشكلة تالف).command"

            mkdir -p src-tauri/target/release/bundle/dmg

            VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
            DMG_OUT="src-tauri/target/release/bundle/dmg/Mar2i_${VERSION}_aarch64.dmg"
            hdiutil create -volname "Mar2i" -srcfolder "$STAGING_DIR" -ov -format UDZO "$DMG_OUT"
            rm -rf "$STAGING_DIR"
            ls -la src-tauri/target/release/bundle/dmg/
          else
            bunx tauri build
          fi

      - name: Prepare staged artifacts
        if: steps.filter.outputs.skip != 'true'
        shell: bash
        run: |
          mkdir -p release-artifacts
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp src-tauri/target/release/bundle/dmg/*.dmg release-artifacts/ || true
          elif [ "${{ runner.os }}" = "Windows" ]; then
            cp src-tauri/target/release/bundle/nsis/*.exe release-artifacts/ || true
            cp src-tauri/target/release/bundle/msi/*.msi release-artifacts/ || true
          fi
          cd release-artifacts
          shasum -a 256 * > SHA256SUMS-${{ matrix.id }}.txt 2>/dev/null || sha256sum * > SHA256SUMS-${{ matrix.id }}.txt 2>/dev/null || true
          if [ "${{ runner.os }}" = "macOS" ]; then
            shasum -a 256 *.dmg > SHA256SUMS.txt 2>/dev/null || true
          fi
          ls -la

      - name: Upload release artifact
        if: steps.filter.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mar2i-${{ matrix.id }}
          path: release-artifacts/*
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: steps.filter.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" != v* ]]; then
            TAG="v0.2.3"
          fi
          echo "Publishing artifacts to release $TAG..."
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "مرئي (Mar2i) $TAG" --notes "Production release $TAG with UI craftsmanship improvements, golden smart compression, and full offline security guarantees."
          cd release-artifacts
          for f in *; do
            if [ -f "$f" ]; then
              echo "Uploading $f to release $TAG..."
              gh release upload "$TAG" "$f" --clobber || true
            fi
          done

  update-homebrew-cask:
    name: Synchronize Homebrew Cask
    runs-on: macos-15
    needs: build-release
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Update Cask Formula & Sync Tap
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" != v* ]]; then
            TAG="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          VERSION="${TAG#v}"
          echo "Updating Homebrew Cask for release $VERSION..."
          ./scripts/update-homebrew-cask.sh --version="$VERSION"
