name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ts:
    name: TypeScript — typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun test

      - name: Oxlint
        run: bun run lint

  rust-core:
    name: Rust core — clippy + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: rust-core-${{ hashFiles('core/Cargo.lock') }}

      - name: Rust formatting
        run: cargo fmt --all --manifest-path core/Cargo.toml --check

      - name: Clippy (core)
        run: cargo clippy --all-targets --manifest-path core/Cargo.toml -- -D warnings

      - name: Install FFmpeg for integration tests
        timeout-minutes: 5
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg

      - name: Tests (core)
        env:
          MAR2I_TEST_FFMPEG: /usr/bin/ffmpeg
          MAR2I_TEST_FFPROBE: /usr/bin/ffprobe
        run: cargo test --manifest-path core/Cargo.toml
