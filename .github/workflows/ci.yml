name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ts:
    name: TypeScript — typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun test

      - name: Oxlint
        run: bun run lint

  rust-core:
    name: Rust core — clippy + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: rust-core-${{ hashFiles('core/Cargo.lock') }}

      - name: Rust formatting
        run: cargo fmt --all --manifest-path core/Cargo.toml --check

      - name: Clippy (core)
        run: cargo clippy --all-targets --manifest-path core/Cargo.toml -- -D warnings

      - name: Setup Bun for CI-only media tools
        uses: oven-sh/setup-bun@v2

      - name: Install FFmpeg and FFprobe for integration tests
        timeout-minutes: 5
        run: |
          # Version-pinned test binaries only; they are not part of desktop distribution.
          mkdir -p "$RUNNER_TEMP/mar2i-media-tools"
          cd "$RUNNER_TEMP/mar2i-media-tools"
          bun init -y
          bun add --exact --trust ffmpeg-static@5.3.0 ffprobe-static@3.1.0
          FFMPEG_PATH="$(bun -e 'process.stdout.write(require("ffmpeg-static"))')"
          FFPROBE_PATH="$(bun -e 'process.stdout.write(require("ffprobe-static").path)')"
          test -x "$FFMPEG_PATH"
          test -x "$FFPROBE_PATH"
          "$FFMPEG_PATH" -version > /dev/null
          "$FFPROBE_PATH" -version > /dev/null
          echo "MAR2I_TEST_FFMPEG=$FFMPEG_PATH" >> "$GITHUB_ENV"
          echo "MAR2I_TEST_FFPROBE=$FFPROBE_PATH" >> "$GITHUB_ENV"

      - name: Tests (core)
        run: cargo test --manifest-path core/Cargo.toml
