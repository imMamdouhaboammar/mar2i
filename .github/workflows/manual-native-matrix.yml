name: Manual Native Compile Matrix

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target platform to check (all, macos-arm64, macos-intel, windows-x64)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - macos-arm64
          - macos-intel
          - windows-x64

jobs:
  native-compile:
    name: ${{ matrix.name }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm64
            name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
          - id: macos-intel
            name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
          - id: windows-x64
            name: Windows x86-64
            os: windows-2022
            target: x86_64-pc-windows-msvc

    steps:
      - name: Filter target
        id: filter
        shell: bash
        run: |
          CHOICE="${{ github.event.inputs.target || 'all' }}"
          if [ "$CHOICE" != "all" ] && [ "$CHOICE" != "${{ matrix.id }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.filter.outputs.skip != 'true'

      - name: Setup Bun
        if: steps.filter.outputs.skip != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        if: steps.filter.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - name: Cache cargo registry & target
        if: steps.filter.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            src-tauri/target
            core/target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target }}-cargo-

      - name: Install frontend dependencies
        if: steps.filter.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Build frontend web assets
        if: steps.filter.outputs.skip != 'true'
        run: bun run build

      - name: Rust formatting check (core & tauri)
        if: steps.filter.outputs.skip != 'true'
        run: |
          cargo fmt --all --manifest-path core/Cargo.toml --check
          cargo fmt --all --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy checks (core & tauri)
        if: steps.filter.outputs.skip != 'true'
        run: |
          cargo clippy --all-targets --manifest-path core/Cargo.toml --target ${{ matrix.target }} -- -D warnings
          cargo clippy --all-targets --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} -- -D warnings

      - name: Native Tauri compile check
        if: steps.filter.outputs.skip != 'true'
        run: cargo check --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Native desktop binary build (debug verification only, no installer bundling)
        if: steps.filter.outputs.skip != 'true'
        run: cargo build --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
